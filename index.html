<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Risk Assessment Journal</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Roboto, sans-serif;
}

body {
    background: #000;
    color: #fff;
}

section {
    width: 100%;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

button {
    cursor: pointer;
    border: none;
    padding: 14px 26px;
    font-size: 20px;
    border-radius: 10px;
}

#title-screen h1 {
    font-size: 32px;
    text-align: center;
    margin-bottom: 30px;
}

#start-btn {
    background: #fff;
    color: #000;
}

#cards-screen {
    background: #fff;
    color: #000;
    display: none;
}

.cards-grid {
    width: 100%;
    max-width: 500px;
    display: grid;
    grid-template-columns: 1fr;
    gap: 20px;
}

.card {
    width: 100%;
    min-height: 180px;
    perspective: 1000px;
    cursor: pointer;
}

.card-inner {
    width: 100%;
    height: 100%;
    position: relative;
    transition: transform 0.6s;
    transform-style: preserve-3d;
}

.card.flipped .card-inner {
    transform: rotateY(180deg);
}

.card-face {
    position: absolute;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
    border-radius: 14px;
    padding: 15px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    background: #1a1a1a;
    color: #fff;
    border: 3px solid;
    font-size: 16px;
    line-height: 1.3;
}

.card-face h3 {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 10px;
    color: #fff;
    border-bottom: 2px solid #fff;
    padding-bottom: 5px;
    width: 100%;
    text-align: center;
}

.card-front {
    border-color: #E74C3C;
    transform: rotateY(0deg);
}

.card-back {
    border-color: #4fa36f;
    transform: rotateY(180deg);
}

#play-btn {
    display: none;
    margin-top: 30px;
    background: #000;
    color: #fff;
    border: 2px solid #000;
}
</style>
</head>

<body>

<section id="title-screen">
    <h1>Risk Assessment Journal for DIP Area</h1>
    <button id="start-btn">Start</button>
</section>

<section id="cards-screen">
    <h2 style="margin-bottom: 7px; text-align: center;">
        Risk / Control<br>(click the card)
    </h2>

    <div class="cards-grid" id="cards-container"></div>

    <a href="pingpong.html">
        <button id="play-btn">Play?</button>
    </a>
</section>

<script>
const title = document.getElementById("title-screen");
const cards = document.getElementById("cards-screen");
const startBtn = document.getElementById("start-btn");
const playBtn = document.getElementById("play-btn");

startBtn.onclick = () => {
    title.style.display = "none";
    cards.style.display = "flex";
};

const cardData = [
    {
        title: "Mechanical Hazards",
        front: "Cuts or puncture wounds from sharp component leads during manual assembly.",
        back: "Training on preparation and soldering instructions. Daily workplace checks using LPA checklist."
    },
    {
        title: "Mechanical Hazards",
        front: "Injury caused by sudden disconnection of compressed air hose. Particles getting into eyes.",
        back: "Training and regular inspections of workplaces."
    },
    {
        title: "Mechanical Hazards",
        front: "Slipping or falling on wet floor after cleaning.",
        back: "Use of warning signs and cleaning schedule compliance."
    },
    {
        title: "Electrical Hazards",
        front: "Electric shock due to equipment malfunction.",
        back: "Regular electrical safety inspections and grounding checks."
    },
    {
        title: "Hazardous Substances",
        front: "Skin and eye irritation when using cleaning chemicals.",
        back: "Ventilation system and use of personal protective equipment."
    },
    {
        title: "Fire / Explosion",
        front: "Fire or explosion of chemical containers near heat sources.",
        back: "Proper storage according to safety data sheets and availability of fire extinguishers."
    },
    {
        title: "Hot Surfaces",
        front: "Burns from accidental contact with soldering station heating elements.",
        back: "Warning signs and safety training."
    },
    {
        title: "Noise",
        front: "Exposure to excessive noise from equipment.",
        back: "Workplace noise level monitoring."
    },
    {
        title: "Workplace Climate",
        front: "Too high or too low temperature or humidity.",
        back: "Monitoring of temperature and humidity."
    },
    {
        title: "Lighting",
        front: "Eye strain due to insufficient or excessive lighting.",
        back: "Use of adjustable local lighting."
    },
    {
        title: "Ergonomics",
        front: "Negative impact of prolonged sitting and computer work.",
        back: "Work-rest schedule and regular medical examinations."
    }
];

const container = document.getElementById("cards-container");
let flippedCount = 0;

cardData.forEach(c => {
    const card = document.createElement("div");
    card.className = "card";
    card.dataset.flippedOnce = "false";

    card.innerHTML = `
        <div class="card-inner">
            <div class="card-face card-front">
                <h3>${c.title}</h3>
                <p>${c.front}</p>
            </div>
            <div class="card-face card-back">
                <h3>Control Measures</h3>
                <p>${c.back}</p>
            </div>
        </div>
    `;

    card.onclick = () => {
        const wasFlipped = card.classList.contains("flipped");
        card.classList.toggle("flipped");

        if (!wasFlipped && card.dataset.flippedOnce === "false") {
            card.dataset.flippedOnce = "true";
            flippedCount++;
        }

        if (flippedCount === cardData.length) {
            playBtn.style.display = "block";
        }
    };

    container.appendChild(card);
});
</script>

</body>
</html>
